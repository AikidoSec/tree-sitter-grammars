name: Package all grammars

# Manual escape hatch for validating changes to package.yml (or the build
# itself) against every known grammar, not just the one being tagged.
on:
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.folder }})
    strategy:
      matrix:
        folder:
          - tree-sitter-kotlin
    uses: ./.github/workflows/package.yml
    with:
      folder: ${{ matrix.folder }}
